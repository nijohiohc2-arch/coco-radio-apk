name: Build Coco Radio APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.5' }
      - run: gradle assembleRelease assembleDebug --no-daemon
      - name: Stage APKs
        run: |
          mkdir -p staged
          cp app/build/outputs/apk/release/app-release.apk staged/coco-radio-v3.apk
          cp app/build/outputs/apk/debug/app-debug.apk staged/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: coco-radio-apk
          path: staged/
