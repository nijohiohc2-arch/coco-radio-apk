plugins {
    id 'com.android.application'
}

android {
    namespace "com.jaehui.cocoradio"
    compileSdk 34
    defaultConfig {
        applicationId "com.jaehui.cocoradio2"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.3-coco"
    }
    signingConfigs {
        shared {
            storeFile file("${rootDir}/keystore/coco-radio.p12")
            storePassword "cocoradio"
            keyAlias "coco"
            keyPassword "cocoradio"
            storeType "PKCS12"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            debuggable true
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
}
