
plugins {
    id 'com.android.application'
}

android {
    namespace "com.jaehui.cocoradio"
    compileSdk 34
    defaultConfig {
        applicationId "com.jaehui.cocoradio"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0-coco"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
